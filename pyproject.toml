[project]
name = "freight-reroute-agent"
version = "0.1.0"
description = "Enterprise freight corridor disruption monitoring and intermodal rerouting agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[tool.poetry]
name = "freight-reroute-agent"
version = "0.1.0"
description = "Enterprise freight corridor disruption monitoring and intermodal rerouting agent"
authors = ["Kapil Singhal <singhal.kapil524@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "freight_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = ">=2.7.0"
langgraph = ">=0.2.0"
langchain-core = ">=0.3.0"
langchain-google-genai = ">=2.0.0"
python-dotenv = ">=1.0.0"
httpx = ">=0.27.0"
shapely = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pytest-mock = ">=3.14.0"
respx = ">=0.21.0"
ruff = ">=0.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["freight_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
